<!doctype html>
<html lang="it" data-diego-edition="flip" data-diego-game="scacchi"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Scacchi Stellari — Diego</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f8fa;background:#101519}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit;touch-action:manipulation;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;background:#20272d}
header strong{font-size:24px}header a{color:#fff;text-decoration:none;border:2px solid #8998a4;border-radius:14px;padding:10px 20px;font-size:20px;font-weight:800}
main{max-width:1500px;margin:auto;padding:10px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,.52fr);/*diego-fallback*/--diego-gap:26px;grid-gap:26px;/*end-fallback*/gap:26px;align-items:center}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));/*diego-fallback*/width:76vh;/*end-fallback*/width:min(76vh,76vw,850px);max-width:100%;aspect-ratio:1;border:8px solid #e7e2d4;border-radius:12px;overflow:hidden;box-shadow:0 7px 32px #0009}
.sq{border:0;border-radius:0;position:relative;padding:0;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.light{background:#f1e4c9}.dark{background:#87a48c}
.piece{display:block;width:78%;height:78%;max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-select:none}
.sq.active{box-shadow:inset 0 0 0 7px #f2c230}.star{width:72%;height:72%;filter:drop-shadow(0 2px 2px #664);pointer-events:none}
.controls{display:flex;flex-direction:column;/*diego-fallback*/--diego-gap:15px;grid-gap:15px;/*end-fallback*/gap:15px;align-items:stretch}.controls h1{/*diego-fallback*/font-size:3.6vw;/*end-fallback*/font-size:clamp(30px,3.6vw,60px);margin:0}.instruction{/*diego-fallback*/font-size:2.4vw;/*end-fallback*/font-size:clamp(24px,2.4vw,39px);font-weight:900;min-height:2em;color:#ffe076}
.pick{display:flex;/*diego-fallback*/--diego-gap:10px;grid-gap:10px;/*end-fallback*/gap:10px}.pick button{flex:1;min-height:78px;border:3px solid #64727c;border-radius:18px;background:#232c32;color:#fff;font-size:24px;font-weight:800}
.pick button.on{border-color:#ffd34d;background:#39442d}.pick img.pick-piece{display:block;width:50px;height:50px;object-fit:contain;margin:0 auto 3px;pointer-events:none}
.modes{display:flex;/*diego-fallback*/--diego-gap:12px;grid-gap:12px;/*end-fallback*/gap:12px}.modes button{flex:1;min-width:0;min-height:75px;border:3px solid #79858d;border-radius:18px;background:#27323b;color:#fff;font-weight:850;font-size:18px}
.modes button.on{border-color:#f6cd48;background:#56461e}
.again{min-height:68px;border:0;background:#ffd34d;color:#1b1b1b;border-radius:18px;font-size:26px;font-weight:900}
.progress{font-size:25px;font-weight:800}.hint{font-size:19px;color:#aebcc4}
@media(max-width:850px){main{grid-template-columns:1fr;justify-items:center;padding:12px;/*diego-fallback*/--diego-gap:10px;grid-gap:10px;/*end-fallback*/gap:10px}.board{/*diego-fallback*/width:90vw;/*end-fallback*/width:min(90vw,62vh)}.controls{width:100%;max-width:620px}.controls h1{font-size:26px}.instruction{min-height:0;font-size:25px}.pick button{min-height:57px}.pick img.pick-piece{display:inline-block;vertical-align:middle;width:31px;height:31px;margin:0 5px 0 0}.modes button{min-height:55px;font-size:13px;padding:5px 2px}.hint{font-size:15px}}
</style><link rel="stylesheet" href="diego-runtime.css"><link rel="stylesheet" href="diegoland.css"><link rel="stylesheet" href="diegoland-games.css"><script src="diego-runtime.js"></script></head><body>
<header><strong>DIEGO · SCACCHI</strong><a href="index.html">⌂ MENU</a></header>
<main>
<div class="board" id="board" aria-label="Scacchiera interattiva"></div>
<section class="controls">
<h1>⭐ Scacchi Stellari</h1>
<div class="instruction" id="instruction" role="status">Tocca la stella!</div>
<div class="progress" id="progress" aria-live="polite">★ 0 / 3</div>
<div class="pick" aria-label="Scegli il pezzo">
<button data-piece="king"><img class="pick-piece" src="assets/scacchi/cburnett/wK.svg" alt="" aria-hidden="true" draggable="false"> RE</button>
<button data-piece="rook"><img class="pick-piece" src="assets/scacchi/cburnett/wR.svg" alt="" aria-hidden="true" draggable="false"> TORRE</button>
<button data-piece="queen"><img class="pick-piece" src="assets/scacchi/cburnett/wQ.svg" alt="" aria-hidden="true" draggable="false"> REGINA</button>
</div>
<div class="modes" aria-label="Difficoltà">
<button data-mode="easy">1 · FACILE</button>
<button data-mode="two">2 · PIÙ STELLE</button>
<button data-mode="challenge">3 · SFIDA</button>
</div>
<button class="again" id="again">↻ RICOMINCIA</button>
<div class="hint">Tocca il pezzo e poi la stella. Nei livelli 2 e 3 puoi raccogliere le stelle nell’ordine che preferisci.</div>
</section></main>
<script src="diego-audio.js"></script><script>
'use strict';
const plans={
 king:{name:'RE',glyph:'♔',asset:'assets/scacchi/cburnett/wK.svg',start:[6,4],
       targets:[[5,4],[4,4],[3,3]],challenge:[[5,4],[5,5],[4,5],[3,4],[2,5]]},
 rook:{name:'TORRE',glyph:'♖',asset:'assets/scacchi/cburnett/wR.svg',start:[6,0],
       targets:[[2,0],[2,4],[5,4]],challenge:[[6,4],[2,4],[2,1],[4,1],[4,6]]},
 queen:{name:'REGINA',glyph:'♕',asset:'assets/scacchi/cburnett/wQ.svg',start:[6,0],
        targets:[[4,2],[4,5],[1,5]],challenge:[[4,2],[4,5],[1,5],[2,2],[6,6]]}
};
const chessScope=DiegoRuntime.createScope();
let piece='rook',mode='easy',position,step,selected,locked=false,remaining=[];
const board=document.getElementById('board'),instruction=document.getElementById('instruction'),progress=document.getElementById('progress');
// Fix in pixel, not in grid-content height: a rook moving must never
// stretch a row. Explicit height also supports older Samsung Tizen browsers
// that do not consistently honor aspect-ratio on a CSS grid.
function fitChessboard(){
 const width=board.getBoundingClientRect().width;
 if(!width)return;
 const size=Math.round(width*100)/100;
 board.style.height=size+'px';
 // Pieces size automatically to the square: no system chess font.
}
window.addEventListener('resize',fitChessboard);
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function allowed(a,b){
 const dr=Math.abs(a[0]-b[0]),dc=Math.abs(a[1]-b[1]);
 if(!dr&&!dc)return false;
 return piece==='king'?Math.max(dr,dc)===1:piece==='rook'?dr===0||dc===0:dr===0||dc===0||dr===dc;
}
function totalStars(){return mode==='challenge'?plans[piece].challenge.length:plans[piece].targets.length}
function availableStars(){
 if(mode==='easy')return step<totalStars()?[plans[piece].targets[step]]:[];
 return remaining;
}
function reset(){
 chessScope.reset();DiegoAudio.stop();
 position=plans[piece].start.slice();step=0;selected=mode==='easy';locked=false;
 remaining=(mode==='challenge'?plans[piece].challenge:plans[piece].targets).map(p=>p.slice());
 instruction.textContent=mode==='easy'?'TOCCA LA STELLA!':'TOCCA IL PEZZO!';
 draw();
}
function draw(){
 progress.textContent='★ '+step+' / '+totalStars();
 for(const b of document.querySelectorAll('[data-piece]'))b.classList.toggle('on',b.dataset.piece===piece);
 for(const b of document.querySelectorAll('[data-mode]'))b.classList.toggle('on',b.dataset.mode===mode);
 const stars=availableStars();
 board.replaceChildren();
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const cell=document.createElement('button');
  cell.type='button';cell.className='sq '+((r+c)%2?'dark':'light');
  cell.dataset.r=r;cell.dataset.c=c;cell.setAttribute('aria-label','Casella '+String.fromCharCode(97+c)+(8-r));
  if(same([r,c],position)){
   cell.classList.toggle('active',selected);
   const p=document.createElement('img');p.className='piece';p.src=plans[piece].asset;p.alt='';p.setAttribute('aria-hidden','true');p.draggable=false;cell.append(p);
  }else if(stars.some(p=>same(p,[r,c]))){
   cell.setAttribute('aria-label','Stella da raccogliere');
   cell.innerHTML='<svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 L62 35 L92 38 L69 58 L77 90 L50 73 L23 90 L31 58 L8 38 L38 35 Z" fill="#F99D1B" stroke="#12354E" stroke-width="4"/></svg>';
  }
  cell.addEventListener('click',()=>tap(r,c));board.append(cell);
 }
 fitChessboard();
}
function tap(r,c){
 if(locked||step>=totalStars())return;
 const dest=[r,c];
 if(same(dest,position)){
  selected=true; // Never deselect the piece on a repeated tap.
  instruction.textContent='ORA TOCCA LA STELLA!';
  draw();return;
 }
 if(!selected){instruction.textContent='PRIMA TOCCA IL PEZZO!';return;}
 if(!allowed(position,dest)){instruction.textContent='QUESTA MOSSA NON VA BENE';return;}
 const stars=availableStars();
 const index=stars.findIndex(p=>same(p,dest));
 // From level 2, non-star moves are permitted so the king can reach
 // distant stars; only collecting a star advances the progress counter.
 if(index<0){
  if(mode==='easy'){instruction.textContent='CERCA LA STELLA!';return;}
  position=dest;selected=false;
  instruction.textContent='AVVICINATI ALLE STELLE!';
  draw();return;
 }
 position=dest;step++;selected=mode==='easy';
 if(mode!=='easy')remaining.splice(index,1);
 const finished=step===totalStars();
 instruction.textContent=finished?'⭐ ⭐ ⭐':'⭐';
 DiegoAudio.play(finished?'fantastico':'stella');
 draw();
 if(!finished){
  locked=true;
  chessScope.later(()=>{
   locked=false;
   instruction.textContent=mode==='easy'?'TOCCA LA STELLA!':'TOCCA IL PEZZO!';
  },650);
 }
}
document.querySelectorAll('[data-piece]').forEach(b=>b.addEventListener('click',()=>{piece=b.dataset.piece;reset()}));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;reset()}));
document.getElementById('again').addEventListener('click',reset);
/* TASTI DIEGO: J/K cambia esercizio fra RE/TORRE/REGINA, R ricomincia. */
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
 const k=(e.key||'').toLowerCase();
 if(k==='r'){e.preventDefault();reset()}
 else if(k==='j'||k==='k'){
  e.preventDefault();
  const order=['king','rook','queen'];
  const i=order.indexOf(piece);
  piece=order[(i+(k==='j'?1:order.length-1))%order.length];
  reset();
 }
});
reset();
</script></body></html>
