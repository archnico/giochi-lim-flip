<!doctype html><html lang="it" data-diego-edition="flip"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Diego · Il mondo dell'acqua</title>
<style>
:root{--navy:#082f4b;--cyan:#62d9fa;--white:#f9fdff;--green:#74eaab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#093957;color:var(--white);font-family:system-ui,"DejaVu Sans",sans-serif;touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}button:focus-visible{outline:6px solid #ffe17b;outline-offset:4px}
#app{height:100%;/*diego-fallback*/height:100vh;/*end-fallback*/height:100dvh;display:grid;grid-template-rows:74px minmax(0,1fr)}header{display:flex;align-items:center;justify-content:space-between;background:#07304d;/*diego-fallback*/padding:8px 2vw;/*end-fallback*/padding:8px clamp(10px,2vw,28px);/*diego-fallback*/--diego-gap:10px;grid-gap:10px;/*end-fallback*/gap:10px}header strong{/*diego-fallback*/font-size:2vw;/*end-fallback*/font-size:clamp(18px,2vw,30px);white-space:nowrap}header .right{display:flex;/*diego-fallback*/--diego-gap:10px;grid-gap:10px;/*end-fallback*/gap:10px}header button{min-height:52px;padding:8px 18px;border-radius:16px;background:#14516d;border:2px solid #79cce7;font-weight:800;/*diego-fallback*/font-size:1.5vw;/*end-fallback*/font-size:clamp(15px,1.5vw,22px)}
main{position:relative;min-height:0;overflow:hidden}.view{display:none;width:100%;height:100%;min-height:0}.view.active{display:flex}.menu{flex-direction:column;align-items:center;justify-content:center;/*diego-fallback*/gap:2vh;--diego-gap:2vh;grid-gap:2vh;/*end-fallback*/gap:clamp(12px,2vh,24px);padding:18px;background:radial-gradient(ellipse at 50% 0%,#237cb0,#074069 65%,#052b50)}.menu h1{/*diego-fallback*/font-size:6vw;/*end-fallback*/font-size:clamp(48px,6vw,94px);margin:0;text-shadow:0 5px 18px #002e55}.menu>p{margin:0 0 6px;/*diego-fallback*/font-size:2.5vw;/*end-fallback*/font-size:clamp(20px,2.5vw,34px);color:#d2f5ff}.menu-grid{/*diego-fallback*/width:100%;/*end-fallback*/width:min(1400px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));/*diego-fallback*/gap:2vw;--diego-gap:2vw;grid-gap:2vw;/*end-fallback*/gap:clamp(12px,2vw,26px)}.mode{background:linear-gradient(155deg,#4bcdf2,#0788c6 65%,#086ba9);border:5px solid #b4efff;box-shadow:0 12px 30px #02294488;border-radius:34px;/*diego-fallback*/min-height:36vh;/*end-fallback*/min-height:clamp(190px,36vh,335px);display:flex;align-items:center;justify-content:center;flex-direction:column;/*diego-fallback*/--diego-gap:12px;grid-gap:12px;/*end-fallback*/gap:12px;font-weight:900;/*diego-fallback*/font-size:2.4vw;/*end-fallback*/font-size:clamp(23px,2.4vw,40px);text-align:center;padding:16px}.mode .art{/*diego-fallback*/font-size:11vh;/*end-fallback*/font-size:clamp(70px,11vh,140px);filter:drop-shadow(0 8px 10px #00406888)}.mode:active{transform:scale(.98)}
#splash{position:relative;background:linear-gradient(#55d5f2 0%,#0ca4d5 38%,#026ba9 83%,#055083);touch-action:none}#sea{width:100%;height:100%;touch-action:none;display:block}.overlay{position:absolute;/*diego-fallback*/top:4vh;/*end-fallback*/top:clamp(14px,4vh,45px);left:15px;right:15px;pointer-events:none;text-align:center;font-weight:900;/*diego-fallback*/font-size:4vw;/*end-fallback*/font-size:clamp(32px,4vw,66px);text-shadow:0 4px 8px #075078}.bubblehint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#d2f6ff;/*diego-fallback*/font-size:2vw;/*end-fallback*/font-size:clamp(18px,2vw,30px);pointer-events:none}
#choice{flex-direction:column;/*diego-fallback*/--diego-gap:10px;grid-gap:10px;/*end-fallback*/gap:10px;/*diego-fallback*/padding:1.5vw;/*end-fallback*/padding:clamp(10px,1.5vw,22px);background:linear-gradient(#0d719d,#064e81)}.question{font-weight:950;text-align:center;/*diego-fallback*/font-size:4vw;/*end-fallback*/font-size:clamp(30px,4vw,64px);line-height:1.15}.choices{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;/*diego-fallback*/gap:2vw;--diego-gap:2vw;grid-gap:2vw;/*end-fallback*/gap:clamp(12px,2vw,28px)}.animal{position:relative;overflow:hidden;background:#e7f5fb;border:7px solid #a8e7fa;border-radius:32px;padding:5px;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px #002c5088}.animal img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.animal .name{position:absolute;bottom:0;left:0;right:0;padding:12px 5px 16px;background:linear-gradient(transparent,#082f4be8 45%);font-weight:950;/*diego-fallback*/font-size:3.3vw;/*end-fallback*/font-size:clamp(25px,3.3vw,55px);text-align:center;text-shadow:0 2px 7px #000}.animal.good{border-color:#66f89a;background:#c9ffe7}.animal.wrong{border-color:#ffad9f}.feedback{/*diego-fallback*/font-size:3.2vw;/*end-fallback*/font-size:clamp(24px,3.2vw,42px);font-weight:900;text-align:center;height:1.3em;color:#fff}
#pool{position:relative;flex-direction:column;align-items:center;/*diego-fallback*/--diego-gap:8px;grid-gap:8px;/*end-fallback*/gap:8px;background:linear-gradient(#a3eaff,#e1faff);/*diego-fallback*/padding:1.3vw;/*end-fallback*/padding:clamp(8px,1.3vw,18px);color:#064265}.pooltitle{/*diego-fallback*/font-size:3.2vw;/*end-fallback*/font-size:clamp(27px,3.2vw,53px);font-weight:950;text-align:center}.poolscene{position:relative;/*diego-fallback*/width:97%;/*end-fallback*/width:min(1250px,97%);min-height:0;flex:1;overflow:hidden;border-radius:36px;border:14px solid white;background:linear-gradient(#eefcff,#b0e6fa);box-shadow:0 8px 22px #00568855}.poolwater{position:absolute;bottom:0;width:100%;height:0;background:linear-gradient(#84ecf9,#1daedb 45%,#037cb9);transition:height .15s linear;overflow:hidden}.poolwater:before{content:"";position:absolute;top:-14px;left:-10%;width:120%;height:40px;background:repeating-radial-gradient(ellipse at 50% 80%,#d8ffff 0 7px,#68d6f1 12px 22px,transparent 29px 40px);opacity:.8;animation:drift 3s linear infinite}@keyframes drift{to{transform:translateX(35px)}}.tapjet{position:absolute;z-index:2;right:12%;top:0;/*diego-fallback*/width:2vw;/*end-fallback*/width:clamp(14px,2vw,30px);height:0;background:linear-gradient(90deg,#d7ffff,#58d5ff,#bffaff);opacity:0;transition:opacity .1s;border-radius:8px}.tapjet.on{opacity:1;height:80%}.pooltoy{position:absolute;bottom:6px;left:20%;/*diego-fallback*/font-size:7vw;/*end-fallback*/font-size:clamp(50px,7vw,110px);transition:bottom .15s}.tapbtn{position:relative;/*diego-fallback*/min-width:92%;/*end-fallback*/min-width:min(640px,92%);/*diego-fallback*/min-height:12vh;/*end-fallback*/min-height:clamp(82px,12vh,132px);/*diego-fallback*/font-size:4vw;/*end-fallback*/font-size:clamp(27px,4vw,56px);font-weight:950;border:5px solid #045b89;border-radius:28px;background:linear-gradient(#28b8ec,#087caf);box-shadow:0 6px 0 #045a84;touch-action:none;user-select:none}.tapbtn:active,.tapbtn.pressing{background:#0875a5;transform:translateY(4px);box-shadow:0 2px 0 #045a84}.reset{position:absolute;top:15px;left:15px;z-index:3;font-size:22px;background:#0b789a;border:2px solid white;border-radius:14px;padding:10px 18px}
@media(max-width:720px){#app{grid-template-rows:62px minmax(0,1fr)}header button{min-height:42px;padding:5px 10px}.menu-grid{grid-template-columns:1fr;overflow:auto}.mode{min-height:100px;flex-direction:row}.mode .art{font-size:60px}.animal{border-width:4px}.animal .name{font-size:22px}.poolscene{border-width:7px}}
@media(max-height:650px){.menu h1{font-size:44px}.menu>p{font-size:18px}.mode{min-height:150px}.mode .art{font-size:65px}.tapbtn{min-height:70px}.pooltitle{font-size:27px}}
.feedback{font-size:clamp(48px,5.5vw,88px);line-height:1;height:1.1em}
</style><link rel="stylesheet" href="diego-runtime.css"><script src="diego-runtime.js"></script></head><body><div id="app"><header><strong>🌊 DIEGO · ACQUA</strong><div class="right"><button id="sound" aria-pressed="true">🔊 SUONO</button><button id="back">⌂ MENU</button></div></header><main>
<section id="menu" class="view menu active"><h1>🌊 IL MONDO DELL'ACQUA</h1><p>TOCCA · ASCOLTA · GIOCA</p><div class="menu-grid">
<button class="mode" data-go="splash"><span class="art">💦</span>TOCCA L'ACQUA</button><button class="mode" data-go="choice"><span class="art">🐬</span>CHI NUOTA?</button><button class="mode" data-go="pool"><span class="art">🏊</span>LA PISCINA</button></div></section>
<section id="splash" class="view"><canvas id="sea" aria-label="Tocca o trascina il dito sull'acqua per creare onde"></canvas><div class="overlay">FAI SPLASH! 💦</div><div class="bubblehint">TOCCA O MUOVI IL DITO NELL'ACQUA</div></section>
<section id="choice" class="view"><div class="question">CHI NUOTA NELL'ACQUA? 🌊</div><div class="choices"><button class="animal" id="animal0"></button><button class="animal" id="animal1"></button></div><div id="feedback" class="feedback" aria-live="polite"></div></section>
<section id="pool" class="view"><div class="pooltitle" id="pooltitle">TIENI PREMUTO PER RIEMPIRE LA PISCINA!</div><div class="poolscene"><div class="poolwater" id="water"></div><div class="tapjet" id="jet"></div><div class="pooltoy" id="toy">🛟</div></div><button class="tapbtn" id="tapwater">🚰 APRI L'ACQUA</button></section>
</main></div><script src="diego-audio.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),waterScope=DiegoRuntime.createScope();
let view='menu',soundOn=DiegoAudio.isEnabled(),ac=null,noise=null,round=0,locked=false,poolLevel=0,hold=false,holdFrame=0,seaFrame=0,lastHold=0;
let waves=[],droplets=[],lastNoise=0,waterNodes=[];
function soundContext(){if(!soundOn)return null;try{const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)return null;ac=ac||new AudioEngine();if(ac.state==='suspended'){const p=ac.resume();if(p&&p.catch)p.catch(()=>{})}if(!noise){noise=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);let a=noise.getChannelData(0),v=0;for(let i=0;i<a.length;i++){v=(v+(.055*(Math.random()*2-1)))*.995;a[i]=Math.max(-1,Math.min(1,v*3))}}return ac}catch(e){return null}}
function waterSound(secs=.55){let c=soundContext();if(!c)return;const t=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noise;f.type='bandpass';f.frequency.setValueAtTime(850,t);f.frequency.exponentialRampToValueAtTime(260,t+secs);f.Q.value=.55;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.34,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+secs);s.connect(f).connect(g).connect(c.destination);s.start(t,Math.random()*.7);s.stop(t+secs+.01);waterNodes.push(s);s.onended=()=>{s.disconnect();f.disconnect();g.disconnect();const i=waterNodes.indexOf(s);if(i>=0)waterNodes.splice(i,1)}}
$('sound').textContent=soundOn?'🔊 SUONO':'🔇 MUTO';$('sound').setAttribute('aria-pressed',String(soundOn));
DiegoAudio.subscribe(function(enabled){soundOn=enabled;$('sound').textContent=enabled?'SUONI':'MUTO';$('sound').setAttribute('aria-pressed',String(enabled));$('sound').setAttribute('aria-label',enabled?'Disattiva suoni':'Attiva suoni');if(!enabled){waterNodes.slice().forEach(s=>{try{s.stop()}catch(e){}});if(ac&&ac.suspend){const p=ac.suspend();if(p&&p.catch)p.catch(()=>{})}}});
$('sound').onclick=()=>{DiegoAudio.setEnabled(!soundOn);if(soundOn)waterSound(.3)};
function stopSea(){cancelAnimationFrame(seaFrame);seaFrame=0;lastSeaDraw=0;waves=[];droplets=[]}
function show(id){stopHold();stopSea();waterScope.reset();DiegoAudio.stop();view=id;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));if(id==='splash'){resizeSea();seaFrame=requestAnimationFrame(frame)}if(id==='choice')nextAnimal();if(id==='pool')resetPool()}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$('back').onclick=()=>{if(view==='menu')location.href='index.html?topic=acqua';else show('menu')};document.addEventListener('keydown',e=>{if(e.key==='Escape')show('menu')});
const canvas=$('sea'),ctx=canvas.getContext('2d');function resizeSea(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);if(ctx)ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',()=>{if(view==='splash')resizeSea()});
function addWave(x,y,now){waves.push({x,y,t:now});for(let i=0;i<4;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*140;droplets.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-75,t:now,size:2+Math.random()*6})}if(waves.length>16)waves.splice(0,waves.length-16);if(droplets.length>100)droplets.splice(0,droplets.length-100);if(now-lastNoise>145){waterSound(.42);lastNoise=now}}
let lastTouch=0,lastSeaDraw=0;function touchSea(e,move){if(view!=='splash'||!ctx)return;let now=performance.now();if(move&&now-lastTouch<40)return;lastTouch=now;let r=canvas.getBoundingClientRect();addWave(e.clientX-r.left,e.clientY-r.top,now)}DiegoRuntime.press(canvas,{start:e=>touchSea(e,false),move:e=>touchSea(e,true)});
function frame(now){seaFrame=0;if(view==='splash'&&!document.hidden&&ctx){if(now-lastSeaDraw<34){seaFrame=requestAnimationFrame(frame);return}lastSeaDraw=now;let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);for(let j=0;j<13;j++){let y=h*(j+.5)/13;ctx.beginPath();for(let x=0;x<=w+12;x+=12){let yy=y+Math.sin(x*.014+now*.0015+j)*8+Math.sin(x*.027-now*.001+j)*4;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.strokeStyle=j%2?'#b9f9ff27':'#ffffff24';ctx.lineWidth=4;ctx.stroke()}waves=waves.filter(v=>now-v.t<1300);waves.forEach(v=>{let age=(now-v.t)/1300;for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(v.x,v.y,age*160+j*20,age*65+j*9,0,0,2*Math.PI);ctx.lineWidth=8-j*2;ctx.strokeStyle='rgba(244,255,255,'+Math.max(0,(1-age)*(.9-j*.2))+')';ctx.stroke()}});droplets=droplets.filter(v=>now-v.t<750);droplets.forEach(v=>{let t=(now-v.t)/1000,x=v.x+v.vx*t,y=v.y+v.vy*t+180*t*t;ctx.beginPath();ctx.arc(x,y,v.size*(1-t),0,Math.PI*2);ctx.fillStyle='rgba(237,255,255,'+(1-t/.75)*.9+')';ctx.fill()});seaFrame=requestAnimationFrame(frame)}};
const wet=[['DELFINO','delfino'],['PESCE','pesce'],['BALENA','balena'],['POLPO','polpo'],['SQUALO','squalo']],dry=[['LEONE','leone'],['ELEFANTE','elefante'],['GIRAFFA','giraffa'],['CANE','cane'],['CAVALLO','cavallo']];
function nextAnimal(){locked=false;$('feedback').textContent='';let i=round%wet.length,correct=round%2,items=[wet[i],dry[i]];[0,1].forEach(k=>{let b=$('animal'+k),a=k===correct?items[0]:items[1];b.className='animal';b.dataset.correct=String(k===correct);b.setAttribute('aria-label',a[0]);b.innerHTML='<img src="assets/habitat/'+a[1]+'.webp" alt="'+a[0]+'" draggable="false"><span class="name">'+a[0]+'</span>'});round++}
[0,1].forEach(i=>$('animal'+i).onclick=()=>{if(locked||view!=='choice')return;let b=$('animal'+i);if(b.dataset.correct==='true'){locked=true;b.classList.add('good');$('feedback').textContent='🌊 ⭐';waterSound(.65);DiegoAudio.play('bolle');waterScope.later(()=>{if(view==='choice')nextAnimal()},1350)}else{b.classList.add('wrong');$('feedback').textContent='↻';waterScope.later(()=>{b.classList.remove('wrong');if(view==='choice'&&!locked)$('feedback').textContent=''},650)}});
function resetPool(){stopHold();poolLevel=0;$('water').style.height='0%';$('toy').style.bottom='6px';$('pooltitle').textContent='TIENI PREMUTO PER RIEMPIRE LA PISCINA!';$('tapwater').textContent='🚰 APRI L\'ACQUA'}
function updatePool(now){if(!hold||view!=='pool')return;const elapsed=Math.max(0,Math.min(50,now-lastHold));lastHold=now;poolLevel=Math.min(100,poolLevel+elapsed*.033);$('water').style.height=poolLevel+'%';$('toy').style.bottom='calc('+poolLevel+'% + 6px)';if(now-lastNoise>400){waterSound(.65);lastNoise=now}if(poolLevel>=100){stopHold();$('pooltitle').textContent='🌊 ⭐';$('tapwater').textContent='🔁 ANCORA!';DiegoAudio.play('fantastico');return}holdFrame=requestAnimationFrame(updatePool)}
function stopHold(){hold=false;cancelAnimationFrame(holdFrame);$('jet').classList.remove('on');$('tapwater').classList.remove('pressing')}
function startHold(){if(view!=='pool')return;if(poolLevel>=100){resetPool();return}if(hold)return;hold=true;lastHold=performance.now();$('tapwater').classList.add('pressing');$('jet').classList.add('on');waterSound(.7);holdFrame=requestAnimationFrame(updatePool)}
DiegoRuntime.press($('tapwater'),{start:startHold,end:stopHold});
$('tapwater').addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();startHold()}});
window.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stopHold()});
window.addEventListener('blur',stopHold);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopHold();stopSea();waterNodes.slice().forEach(s=>{try{s.stop()}catch(e){}})}else if(view==='splash'&&!seaFrame){resizeSea();seaFrame=requestAnimationFrame(frame)}});
window.addEventListener('pagehide',()=>{stopHold();stopSea()});

const requested=new URLSearchParams(location.search).get('game');if(['splash','choice','pool'].includes(requested))show(requested);
</script></body></html>
