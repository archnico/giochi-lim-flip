<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Diego — Prova suoni</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#e8f5ff;color:#12354c}main{max-width:1100px;margin:auto;padding:24px}h1{/*diego-fallback*/font-size:5vw;/*end-fallback*/font-size:clamp(32px,5vw,64px);margin:12px 0}p{/*diego-fallback*/font-size:2.5vw;/*end-fallback*/font-size:clamp(19px,2.5vw,28px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));/*diego-fallback*/--diego-gap:18px;grid-gap:18px;/*end-fallback*/gap:18px}button{/*diego-fallback*/font:700 4vw system-ui;/*end-fallback*/font:700 clamp(25px,4vw,48px) system-ui;min-height:170px;border:5px solid #ffffff;border-radius:28px;background:#fff;box-shadow:0 5px 14px #8cacc0;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.97);background:#b4e3ff}.secondary{font-size:22px;min-height:75px;padding:12px 24px;margin-top:24px}.note{font-size:18px}#state{font-weight:bold;min-height:34px}@media(max-width:650px){.grid{grid-template-columns:1fr}button{min-height:105px}}</style>
<main><h1>🔊 Prova dei suoni</h1><p>Tocca un pulsante. Suoni brevi, delicati e disponibili senza Internet.</p><div class="grid"><button data-sound="bravo">⭐ Bravo!</button><button data-sound="fantastico">🎉 Fantastico!</button><button data-sound="stella">✨ Stella</button><button data-sound="bolle">🫧 Bolle</button></div><p id="state" aria-live="polite">Pronto</p><button class="secondary" id="stop">🔇 Ferma il suono</button> <button class="secondary" id="again">🔁 Ripeti l'ultimo</button><p class="note">Regola il volume fisico della LIM prima della prova. Nessun effetto parte automaticamente.</p><p><a href="index.html">← Torna ai giochi</a></p></main><script>
const paths={bravo:'assets/suoni/bravo.wav',fantastico:'assets/suoni/fantastico.wav',stella:'assets/suoni/stella.wav',bolle:'assets/suoni/bolle.wav'};
const player=new Audio();player.preload='auto';let last='bravo';
function play(name){last=name;player.pause();player.currentTime=0;player.src=paths[name];player.play().then(()=>{document.getElementById('state').textContent='In ascolto: '+name}).catch(()=>{document.getElementById('state').textContent='Audio non disponibile: controlla volume o browser'})}
document.querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.sound)));
document.getElementById('stop').onclick=()=>{player.pause();player.currentTime=0;document.getElementById('state').textContent='Fermato'};
document.getElementById('again').onclick=()=>play(last);
</script></html>
