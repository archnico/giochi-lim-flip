<!doctype html>
<html lang="it"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Giochi LIM — Diagnostica touch</title>
<style>
:root{color-scheme:dark;--bg:#111315;--panel:#242a31;--ink:#fafafa;--accent:#ffd34d;--ok:#80dc98;--line:#57616b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;/*diego-fallback*/--diego-gap:18px;grid-gap:18px;/*end-fallback*/gap:18px;border-bottom:2px solid #39414b}
h1{/*diego-fallback*/font-size:2.5vw;/*end-fallback*/font-size:clamp(20px,2.5vw,36px);margin:0}
p{margin:4px 0 0;/*diego-fallback*/font-size:1.3vw;/*end-fallback*/font-size:clamp(13px,1.3vw,20px);color:#c6cbd0}
nav{display:flex;/*diego-fallback*/--diego-gap:10px;grid-gap:10px;/*end-fallback*/gap:10px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
nav button{min-height:54px;border:2px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--panel);color:var(--ink)}
#board{flex:1;min-height:0;position:relative;touch-action:none;background-image:linear-gradient(90deg,transparent 49.9%,#30363d 50%,transparent 50.1%),linear-gradient(transparent 49.9%,#30363d 50%,transparent 50.1%)}
.target{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);/*diego-fallback*/width:12vw;/*end-fallback*/width:clamp(94px,12vw,180px);/*diego-fallback*/height:16vh;/*end-fallback*/height:clamp(92px,16vh,140px);touch-action:none;border-radius:16px;border:3px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;/*diego-fallback*/--diego-gap:5px;grid-gap:5px;/*end-fallback*/gap:5px}
.target .bull{border:4px solid var(--accent);border-radius:50%;/*diego-fallback*/width:6vh;/*end-fallback*/width:clamp(46px,6vh,76px);/*diego-fallback*/height:6vh;/*end-fallback*/height:clamp(46px,6vh,76px);display:grid;place-items:center;/*diego-fallback*/font-size:4vh;/*end-fallback*/font-size:clamp(30px,4vh,48px);color:var(--accent)}
.target .caption{/*diego-fallback*/font-size:1.4vw;/*end-fallback*/font-size:clamp(14px,1.4vw,22px)}
.target.touched{border-color:var(--ok);background:#163623}
.target.touched .bull{border-color:var(--ok);color:var(--ok)}
footer{padding:10px 16px;min-height:61px;border-top:2px solid #39414b;display:flex;/*diego-fallback*/--diego-gap:14px;grid-gap:14px;/*end-fallback*/gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;/*diego-fallback*/font-size:1.2vw;/*end-fallback*/font-size:clamp(12px,1.2vw,17px)}
#feedback{color:var(--accent)}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}#marker{position:fixed;display:none;z-index:100;pointer-events:none;border:3px solid #ff5479;border-radius:50%;width:34px;height:34px;transform:translate(-50%,-50%)}
#marker:before,#marker:after{content:"";position:absolute;background:#ff5479}
#marker:before{height:3px;width:52px;left:-12px;top:13px}
#marker:after{height:52px;width:3px;top:-12px;left:13px}
@media(max-height:660px){header{padding:6px 12px}nav button{min-height:42px}#board{/*diego-fallback*/--diego-gap:6px;grid-gap:6px;/*end-fallback*/gap:6px;padding:7px}.target .bull{width:38px;height:38px;font-size:22px}.target{/*diego-fallback*/--diego-gap:0;grid-gap:0;/*end-fallback*/gap:0}footer{padding:6px}}
</style></head><body>
<header><div><h1>Prova LIM · 9 punti</h1><p>Tocca i 9 bersagli; poi trascina un dito per disegnare una linea.</p></div>
<nav><button type="button" id="reset">Ricomincia</button><button type="button" id="full">⛶ Schermo intero</button><button type="button" id="games">Giochi →</button></nav></header>
<main id="board" aria-label="Griglia diagnostica 3 per 3"></main>
<footer><span id="progress">0 / 9 centrati</span><span id="feedback">Il segno rosa mostra dove arriva il tocco al computer.</span><span id="screen"></span></footer>
<canvas id="trail" aria-hidden="true"></canvas><div id="marker" aria-hidden="true"></div>
<script>
const names=['Alto sinistra','Alto centro','Alto destra','Centro sinistra','Centro','Centro destra','Basso sinistra','Basso centro','Basso destra'];
const board=document.getElementById('board'), progress=document.getElementById('progress'), feedback=document.getElementById('feedback'), screenInfo=document.getElementById('screen'), marker=document.getElementById('marker'), trail=document.getElementById('trail'), ctx=trail.getContext('2d');
let activePointer=null;
let hit=new Set();
board.innerHTML=names.map((name,i)=>'<button type="button" class="target" style="--x:'+[8.5,50,91.5][i%3]+'%;--y:'+[15,50,85][Math.floor(i/3)]+'%" data-i="'+i+'"><span class="bull">+</span><span class="caption">'+name+'</span></button>').join('');
function screen(){const d=devicePixelRatio||1;trail.width=Math.round(innerWidth*d);trail.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=5;ctx.strokeStyle='#ff5479';ctx.lineCap='round';ctx.lineJoin='round';screenInfo.textContent=innerWidth+' × '+innerHeight+' · DPR '+d.toFixed(2)+' · '+(document.fullscreenElement?'fullscreen':'finestra');}
function showPoint(e){marker.style.left=e.clientX+'px';marker.style.top=e.clientY+'px';marker.style.display='block';}
board.addEventListener('pointerdown',e=>{
  activePointer=e.pointerId;ctx.beginPath();ctx.moveTo(e.clientX,e.clientY);showPoint(e);
  const button=e.target.closest('.target');
  if(!button)return;
  const i=Number(button.dataset.i), r=button.getBoundingClientRect();
  // Screen-edge accuracy is a physical comparison between the pink marker and the finger.
  const distance=Math.round(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2)));
  const valid=distance<Math.min(r.width,r.height)*0.35;
  if(valid){hit.add(i);button.classList.add('touched');}
  progress.textContent=hit.size+' / 9 centrati';
  feedback.textContent=(valid?'✓ ':'Vicino, riprova: ')+names[i]+' · '+e.pointerType+' · ('+Math.round(e.clientX)+','+Math.round(e.clientY)+')';
  if(hit.size===9)feedback.textContent='✓ Nove bersagli raggiunti: controlla anche il segno rosa rispetto al dito.';
});
document.addEventListener('pointermove',e=>{if(activePointer!==e.pointerId)return;ctx.lineTo(e.clientX,e.clientY);ctx.stroke();showPoint(e)});
document.addEventListener('pointerup',e=>{if(activePointer===e.pointerId)activePointer=null});
document.addEventListener('pointercancel',e=>{if(activePointer===e.pointerId)activePointer=null});
document.getElementById('reset').onclick=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);hit.clear();document.querySelectorAll('.target').forEach(x=>x.classList.remove('touched'));progress.textContent='0 / 9 centrati';feedback.textContent='Riparti dagli angoli.';marker.style.display='none';};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){feedback.textContent='Fullscreen non disponibile: usa F11.'}screen();};
document.getElementById('games').onclick=()=>{location.href='index.html';};
document.addEventListener('fullscreenchange',screen);
addEventListener('resize',screen);
screen();
</script></body></html>
