<!doctype html><html lang="it" data-diego-edition="flip" data-diego-game="colori"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diego - Colori animali</title><style>*{box-sizing:border-box}body{margin:0;background:#f6fbff;color:#153553;font-family:system-ui}header{height:85px;background:#dceefa;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;font-size:32px;font-weight:800}.nav button{font-size:26px;padding:9px 20px}.main{display:grid;grid-template-columns:1.2fr 1fr;/*diego-fallback*/--diego-gap:22px;grid-gap:22px;/*end-fallback*/gap:22px;padding:20px;/*diego-fallback*/height:calc(100vh - 145px);/*end-fallback*/height:calc(100dvh - 145px)}.animal,.choice{border:6px solid #91c1e5;border-radius:32px;background:white}.animal{display:flex;flex-direction:column;align-items:center;justify-content:center}.drawing{/*diego-fallback*/font-size:27vw;/*end-fallback*/font-size:min(27vw,355px);line-height:1.2}.name{font-size:58px;font-weight:900}.choices{display:grid;grid-template-rows:repeat(3,1fr);/*diego-fallback*/--diego-gap:16px;grid-gap:16px;/*end-fallback*/gap:16px}.choice{display:flex;align-items:center;justify-content:center;/*diego-fallback*/--diego-gap:36px;grid-gap:36px;/*end-fallback*/gap:36px;cursor:pointer;touch-action:manipulation}.dot{/*diego-fallback*/width:9vw;/*end-fallback*/width:min(9vw,125px);/*diego-fallback*/height:9vw;/*end-fallback*/height:min(9vw,125px);border-radius:50%;border:3px solid #aaa}.good{background:#dbf9d8}.bad{background:#ffe1e1}#message{text-align:center;font-size:29px;font-weight:800}
/* Impaginazione touch per telefoni, con foto/disegno centrale e tre bersagli grandi. */
@media(max-width:700px){
 body{min-height:100vh;display:flex;flex-direction:column}
 header{height:auto;min-height:66px;flex:0 0 auto;padding:8px 10px;gap:6px;font-size:19px}
 .nav{display:flex;gap:5px;flex-shrink:0}
 .nav button{min-width:42px;min-height:46px;padding:5px 7px;font-size:21px}
 .main{height:auto;min-height:0;flex:1;padding:10px;gap:10px;grid-template-columns:minmax(0,1fr);
   grid-template-rows:minmax(0,1.2fr) minmax(0,.95fr)}
 .animal{min-height:0;min-width:0;border-width:3px;border-radius:22px}
 .drawing{font-size:20vh;font-size:clamp(86px,20vh,190px);line-height:1;max-width:100%}
 .name{font-size:28px;font-size:clamp(24px,7vw,39px);line-height:1.05}
 .choices{min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));
   grid-template-rows:minmax(0,1fr);gap:7px}
 .choice{min-width:0;min-height:95px;border-width:3px;border-radius:18px;
   padding:5px;flex-direction:column;gap:7px}
 .dot{width:31px;width:clamp(24px,8vw,48px);height:31px;height:clamp(24px,8vw,48px);flex:none}
 #message{flex:0 0 auto;padding:5px 8px;min-height:37px;font-size:16px}
}
@media(max-width:370px){
 header{font-size:17px}
 .nav button{min-width:40px;padding:4px}
 .dot{width:24px;height:24px}
}
@media(max-height:550px) and (max-width:700px){
 .drawing{font-size:17vh}
 .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 .choices{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
 .choice{min-height:0;flex-direction:row}
}</style><link rel="stylesheet" href="diego-runtime.css"><link rel="stylesheet" href="diegoland.css"><link rel="stylesheet" href="diegoland-games.css"><script src="diego-runtime.js"></script><header>🐾 I colori degli animali <div class="nav"><button onclick="prev()">◀</button><button onclick="restart()">↻</button><button onclick="next()">▶</button></div></header><main class="main"><div class="animal"><div class="drawing" id="drawing"></div><div class="name" id="name"></div></div><div class="choices" id="choices"></div></main><div id="message"></div><script src="diego-audio.js"></script><script>const C={arancione:'#ff8b00',nero:'#181818',giallo:'#ffe000',marrone:'#925322',bianco:'#fff',grigio:'#92979c',verde:'#43ad42',rosa:'#f3a7bf',blu:'#338de0',rosso:'#e43c35'};const A=[['🐅','Tigre',['arancione','nero'],[['giallo','marrone'],['bianco','grigio']]],['🐼','Panda',['bianco','nero'],[['grigio','rosa'],['giallo','marrone']]],['🦁','Leone',['giallo','marrone'],[['arancione','nero'],['bianco','grigio']]],['🐸','Rana',['verde'],[['rosso'],['blu']]],['🐘','Elefante',['grigio'],[['rosa'],['verde']]],['🦓','Zebra',['bianco','nero'],[['giallo','marrone'],['grigio','rosa']]],['🦩','Fenicottero',['rosa'],[['verde'],['blu']]],['🐞','Coccinella',['rosso','nero'],[['giallo','marrone'],['blu','bianco']]],['🐧','Pinguino',['nero','bianco'],[['verde','giallo'],['rosa','marrone']]],['🦊','Volpe',['arancione','bianco'],[['verde','nero'],['blu','grigio']]]];const colorScope=DiegoRuntime.createScope();const drawing=document.getElementById('drawing'),animalName=document.getElementById('name'),message=document.getElementById('message'),choices=document.getElementById('choices');let i=0,locked=false;function render(){colorScope.reset();DiegoAudio.stop();locked=false;let a=A[i];drawing.textContent=a[0];animalName.textContent=a[1];message.textContent='Animale '+(i+1)+' di '+A.length+' · Tocca i colori giusti!';let opts=[a[2],...a[3]],s=(i*2)%3;opts=opts.slice(s).concat(opts.slice(0,s));choices.innerHTML='';opts.forEach(pair=>{let b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',pair.join(' e '));pair.forEach(c=>{let dot=document.createElement('span');dot.className='dot';dot.style.background=C[c];b.append(dot)});b.onclick=()=>{if(locked)return;if(pair===a[2]){locked=true;b.classList.add('good');message.textContent='⭐';DiegoAudio.play('bravo');colorScope.later(next,1100)}else{b.classList.add('bad');message.textContent='Prova ancora!';colorScope.later(()=>b.classList.remove('bad'),650)}};choices.append(b)})}function next(){i=(i+1)%A.length;render()}function prev(){i=(i+A.length-1)%A.length;render()}function restart(){i=0;render()}/* TASTI DIEGO: J/K avanti/indietro, R ricomincia. */
document.addEventListener('keydown',function(e){
 if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
 var k=(e.key||'').toLowerCase();
 if(k==='j'){e.preventDefault();next()}
 else if(k==='k'){e.preventDefault();prev()}
 else if(k==='r'){e.preventDefault();restart()}
});
render()</script></html>
