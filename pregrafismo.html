<title>Pregrafismo — Diego</title>
<style>
:root{--navy:#103b53;--cyan:#00b6af;--yellow:#ffe36d;--white:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;background:radial-gradient(circle at 8% 88%,#26bca5 0,#0f888a 30%,#10506c 78%,#173956)}
.top{flex:none;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 20px;background:#10364fe8;border-bottom:3px solid #6ed6d6;min-height:78px}
.top strong{font-size:clamp(25px,2.5vw,44px);white-space:nowrap}
.top .toolbar{display:flex;gap:12px;align-items:center}
.btn{border:3px solid #b3eeed;border-radius:18px;background:#174f66;color:#fff;padding:10px 16px;min-height:56px;font-size:clamp(19px,1.5vw,28px);font-weight:bold}
.btn:active{transform:scale(.98);background:#267d84}
.btn.light{background:#fff1a0;color:#20344d;border-color:#fff9d7}
#sound{min-width:118px}
#menu{flex:1;min-height:0;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.intro{max-width:1200px;margin:0 auto;text-align:center}
.intro h1{font-size:clamp(32px,3.7vw,62px);margin:3px 0}
.intro p{font-size:clamp(19px,1.5vw,28px);margin:8px 0 4px}
.chapters{flex:1;min-height:0;width:100%;max-width:1700px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-content:center}
.chapter{min-height:200px;border-radius:28px;border:4px solid #ffffffb8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:linear-gradient(140deg,#14789b,#136681);box-shadow:0 8px 20px #061d3570}
.chapter:nth-child(2n){background:linear-gradient(140deg,#087d74,#126782)}
.chapter:nth-child(3n){background:linear-gradient(140deg,#7151a9,#4164aa)}
.chapter .symbol{font-size:clamp(50px,5.5vw,105px);line-height:1}
.chapter .name{font-weight:900;font-size:clamp(24px,2.4vw,43px);line-height:1.06}
.chapter .detail{font-size:clamp(17px,1.2vw,22px);color:#fffbe6}
.chapter .stars{font-size:clamp(18px,1.2vw,22px);letter-spacing:.2em;color:#ffe26e}
.chapter:last-child{background:linear-gradient(140deg,#168db1,#095e88)}
#play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:10px 15px 12px;gap:8px}
.hud{flex:none;width:100%;max-width:1680px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hud div{min-width:0}.hud h1{margin:0;font-size:clamp(27px,2.3vw,42px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud p{margin:4px 0 0;font-size:clamp(17px,1.3vw,24px);color:#ebffff}
.hud .counter{font-size:clamp(21px,1.7vw,31px);color:#ffe66e;font-weight:bold;white-space:nowrap}
.board-wrap{width:100%;max-width:1680px;flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;border:5px solid #ceffff;border-radius:28px;overflow:hidden;box-shadow:inset 0 0 48px #08b9b866,0 10px 25px #032d3f88;background:#0ca79d}
.board-wrap:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.36;background-image:radial-gradient(circle at 5% 7%,#ffd668 0 8px,transparent 10px),radial-gradient(circle at 8% 93%,#f16f9b 0 12px,transparent 14px),radial-gradient(circle at 95% 90%,#ffe668 0 8px,transparent 10px),radial-gradient(circle at 93% 8%,#be90eb 0 11px,transparent 13px);background-size:100% 100%;background-repeat:no-repeat}
#board{width:100%;height:100%;max-height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.board-tools{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.board-tools .btn{min-height:54px}
#message{position:absolute;top:14px;left:50%;transform:translateX(-50%);border-radius:20px;background:#163a4edf;padding:9px 21px;max-width:95%;text-align:center;font-size:clamp(17px,1.5vw,27px);font-weight:800;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#063d55a8;pointer-events:none;z-index:4;overflow:hidden}
#celebrate .bigstar{font-size:clamp(75px,9vw,155px);animation:pop .6s ease-in-out alternate infinite;text-shadow:0 0 35px #fff}
#celebrate .yay{font-size:clamp(28px,3vw,58px);font-weight:900;text-shadow:0 5px 6px #064050}
#confetti{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;top:-10%;width:16px;height:35px;border-radius:5px;animation:fall 2s linear forwards}
@keyframes fall{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(850px) rotate(600deg)}}
@keyframes pop{from{transform:scale(.92) rotate(-8deg)}to{transform:scale(1.14) rotate(8deg)}}
#guide{pointer-events:none}
@media(max-width:1100px){.chapters{grid-template-columns:repeat(3,1fr);align-content:start}.top strong{font-size:26px}}
@media(max-width:720px){.chapters{grid-template-columns:repeat(2,1fr)}.chapter{min-height:160px}.top{min-height:64px;padding:5px 8px}.top strong{font-size:19px}.top .toolbar{gap:4px}.btn{font-size:16px;min-height:44px;padding:6px 9px;border-radius:12px}.hud p{font-size:15px}.hud h1{font-size:22px}.hud .counter{font-size:18px}.board-tools{gap:6px}.board-wrap{border-width:3px;border-radius:14px}#play{padding:6px;gap:6px}}

</style>

      <button id="zoomOut" type="button" class="btn">−</button>

    </div>
  </div>
</div>

/* A compact lesson viewBox gives the drawn path more of the interactive surface.

function mapEvent(e){

/* Real ink: only touch points that advance sequential path checkpoints can paint.

// Il tracciato resta un unico SVG; gli aggiornamenti visivi sono accorpati

function flushTrace(){

function moveStep(pt){
 if(!state.down||state.done)return;

function moveGesture(ev,id){
